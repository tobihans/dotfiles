"github:google/yamlfmt" = "latest"
"github:jesseduffield/lazydocker" = "latest"
"github:jesseduffield/lazygit" = "latest"
"github:knqyf263/pet" = "latest"
"github:koalaman/shellcheck" = "latest"
"github:max-sixty/worktrunk" = "latest"
"github:quarylabs/sqruff" = "latest"
"github:rtk-ai/rtk" = "latest"
"github:sigstore/cosign" = "latest"
"github:typst/typst" = "latest"
"github:vercel-labs/agent-browser" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"npm:@ansible/ansible-language-server" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:cf" = "latest"
"npm:heroku" = "latest"
"npm:impeccable" = "latest"
"npm:markdownlint-cli" = "latest"
"npm:pnpm" = "latest"
"npm:prettier" = "latest"
"npm:rea-agents" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"pipx:ansible" = { version = "latest", uvx_args = "--with-executables-from ansible-core,ansible-lint" }
"pipx:djlint" = "latest"
"pipx:pyrefly" = "latest"
"pipx:ruff" = "latest"
"pipx:yamllint" = "latest"
bun = "latest"
cargo-binstall = "latest"
elixir = "latest"
erlang = "latest"
herdr = "latest"
java = "27"
js-debug = "latest"
node = "latest"
ruby = "4.0.6"
uv = "latest"

[settings]
auto_install = false
experimental = true
http_timeout = "600s"
idiomatic_version_file_enable_tools = ["ruby", "python", "node", "go"]
paranoid = true
python.uv_venv_auto = true
disable_backends = ["asdf"]

[settings.github]
use_git_credentials = true

[settings.ruby]
compile = false

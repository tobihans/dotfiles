# Noctalia — minimal macOS-style setup. Everything not listed here stays on default.
# Docs: https://docs.noctalia.dev/

# ── Global UI font ───────────────────────────────────────────────────
[shell]
font_family = "SF Pro Display"   # icon theme comes from gsettings (Tela-circle), not here

# ── Top bar ──────────────────────────────────────────────────────────
[bar.default]
position           = "top"
thickness          = 28         # macOS menu bar height
reserve_space      = true       # keep the ~28px gap so windows never hide under the bar
background_opacity = 0.35       # let niri's wallpaper blur do the work
margin_ends        = 0
margin_edge        = 0
radius             = 0
concave_edge_corners = false
start  = ["control-center", "active_window", "workspaces"]
center = ["clock"]
end    = ["media", "tray", "notifications", "network", "bluetooth", "volume", "battery"]

[widget.control-center]
custom_image         = "/usr/share/pixmaps/archlinux-logo.svg"
custom_image_colorize = true                                       # monochrome, follows palette

[widget.media]
hide_when_idle      = true
hide_when_no_media  = true

# ── Dock ─────────────────────────────────────────────────────────────
[dock]
enabled             = true
position            = "bottom"
icon_size           = 32
main_axis_padding   = 8
cross_axis_padding  = 4
item_spacing        = 4
show_dots           = true
auto_hide           = true
reserve_space       = false
show_running        = true
magnification       = true      # default anyway
background_opacity  = 0.5
radius              = 16
concave_edge_corners = false
margin_edge         = 8
pinned              = ["com.mitchellh.ghostty", "trash"]   # desktop-entry IDs, not app names

# ── Idle ─────────────────────────────────────────────────────────────
# Locking does not count as activity, so the suspend timer still runs after the lock.
[idle]
behavior_order        = ["screen-off", "lock", "suspend"]
pre_action_fade_seconds = 2.0

[idle.behavior.screen-off]
action  = "screen_off"
timeout = 300
enabled = true

[idle.behavior.lock]
action  = "lock"
timeout = 480
enabled = true

[idle.behavior.suspend]
action  = "lock_and_suspend"
timeout = 1200
enabled = true
